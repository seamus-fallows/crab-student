name: CI

# Only when asked (the Actions tab, or: gh workflow run ci.yml). Changes are tested locally; this adds the
# machine-side integration test, which needs Linux and tmux. Running on every push used up the free minutes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install tmux (for the machine-side integration test)
        run: sudo apt-get update -q && sudo apt-get install -y -q tmux

      # (setup-uv publishes no floating major tag after v7: name an exact release)
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"

      - name: Lint
        run: uv run ruff check src tests

      - name: Format
        run: uv run ruff format --check src tests

      - name: Tests
        run: uv run pytest -q
