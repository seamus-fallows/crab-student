[project]
name = "crab-student"
version = "0.1.0"
description = "Hand long or heavy tasks to Claude Code on rented Vast.ai machines, from your own Claude Code."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["keyring>=25"]

[project.scripts]
crab-student = "crab_student.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crab_student"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["SIM105", "SIM905"]

[tool.ruff.lint.pycodestyle]
max-line-length = 125  # (the formatter wraps at 110; long messages may run a little over)

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = [
    "integration:the machine side end to end in tmux (needs Linux with tmux, git, bash and pgrep; Linux CI)",
]
